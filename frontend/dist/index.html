    <div id="root"></div>
    <script>
      // Service Worker & Cache Management
      if ('serviceWorker' in navigator) {
        const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

        // Always clean up any stale legacy caches (such as old AgriVision caches)
        if ('caches' in window) {
          caches.keys().then((keys) => {
            keys.forEach((key) => {
              if (key.includes('agrivision') || (isDev && key.includes('arka-assist'))) {
                caches.delete(key).then(() => {
                  console.log('[Arka-assist] Purged stale cache:', key);
                });
              }
            });
          });
        }

        if (isDev) {
          // In development, unregister any active service worker to avoid stale caching during HMR / refresh
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister().then((unregistered) => {
                if (unregistered) {
                  console.log('[Arka-assist Dev] Unregistered stale service worker');
                }
              });
            }
          });
        } else {
          // In production, register PWA service worker
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => console.log('[Arka-assist PWA] Service Worker registered with scope:', reg.scope))
              .catch((err) => console.warn('[Arka-assist PWA] Service Worker registration failed:', err));
          });
        }
      }
    </script>
